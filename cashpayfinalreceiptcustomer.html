<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | Instabasket</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161a;
            --accent: #3b82f6;
            --success: #10b981;
            --text-p: #ffffff;
            --text-s: #94a3b8;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body { 
            background: var(--bg); 
            color: var(--text-p); 
            display: flex; 
            justify-content: center; 
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Success Banner */
        .success-banner {
            background: var(--success);
            color: white;
            padding: 15px;
            margin: -30px -30px 30px -30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .logo { font-size: 26px; font-weight: 800; color: var(--accent); }
        .receipt-info { font-size: 12px; color: var(--text-s); margin-top: 5px; }

        .item-box {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        
        .item { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 12px;
            font-size: 15px;
        }
        .item-details { display: flex; flex-direction: column; }
        .item-qty { font-size: 12px; color: var(--text-s); }

        .divider { border-top: 1px dashed #333; margin: 15px 0; }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .total-label { font-size: 16px; font-weight: 500; color: var(--text-s); }
        .total-val { font-size: 28px; font-weight: 800; color: var(--success); }

        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .footer p { color: var(--text-s); font-size: 13px; margin-bottom: 5px; }
        
        .check-mark {
            width: 60px;
            height: 60px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px auto;
        }

        .btn-home {
            display: block;
            width: 100%;
            padding: 15px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-home:hover { background: #333; }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-banner">
            <span>Payment Verified</span>
        </div>

        <div class="check-mark">✓</div>

        <div class="header">
            <div class="logo">Instabasket</div>
            <div class="receipt-info" id="displayMart">Mart ID: --</div>
            <div class="receipt-info" id="displayDate">Date: --</div>
        </div>

        <div class="item-box">
            <div id="itemList">
                </div>
            <div class="divider"></div>
            <div class="summary-row">
                <span class="total-label">Total Paid (Cash)</span>
                <span class="total-val" id="displayTotal">₹0.00</span>
            </div>
        </div>

        <div class="footer">
            <p>Transaction ID: <span id="displaySaleId" style="color:white;">--</span></p>
            <p>Payment Method: Cash at Counter</p>
            <a href="https://instabasket.in" class="btn-home">Back to Home</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCnzxKihi5R3EBXlQoRABLoH0Z-OGl2R4",
            authDomain: "smartcart-d7f33.firebaseapp.com",
            projectId: "smartcart-d7f33",
            storageBucket: "smartcart-d7f33.firebasestorage.app",
            messagingSenderId: "501090201683",
            appId: "1:501090201683:web:d6baa4f01bd47dc0af16a6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const saleId = params.get('id');
        const martId = params.get('mart');

        async function loadFinalReceipt() {
            if(!saleId || !martId) return;

            try {
                const docRef = doc(db, "marts", martId, "sales", saleId);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const data = snap.data();
                    
                    document.getElementById('displayTotal').innerText = `₹${data.total.toFixed(2)}`;
                    document.getElementById('displaySaleId').innerText = saleId;
                    document.getElementById('displayMart').innerText = `Mart ID: ${martId}`;
                    document.getElementById('displayDate').innerText = `Date: ${data.date || new Date().toLocaleString()}`;

                    const listContainer = document.getElementById('itemList');
                    listContainer.innerHTML = data.items.map(item => `
                        <div class="item">
                            <div class="item-details">
                                <span>${item.name}</span>
                                <span class="item-qty">Qty: ${item.qty}</span>
                            </div>
                            <span>₹${(item.price * item.qty).toFixed(2)}</span>
                        </div>
                    `).join('');
                }
            } catch (e) {
                console.error("Error loading final receipt:", e);
            }
        }

        loadFinalReceipt();
    </script>
</body>
</html>
