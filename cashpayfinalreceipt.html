<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Verification | Instabasket</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161a;
            --accent: #3b82f6;
            --success: #10b981;
            --text-p: #ffffff;
            --text-s: #94a3b8;
        }

        body { 
            background: var(--bg); 
            color: var(--text-p); 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
        }

        .admin-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }

        .header { margin-bottom: 25px; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent); }
        
        .bill-summary { 
            background: #111; 
            padding: 15px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            border-left: 4px solid var(--accent);
        }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; color: var(--text-s); margin-bottom: 8px; text-transform: uppercase; }
        
        input { 
            width: 100%; 
            padding: 14px; 
            background: #000; 
            border: 1px solid #444; 
            border-radius: 10px; 
            color: white; 
            font-size: 18px; 
            text-align: center;
            letter-spacing: 4px;
        }

        .btn-confirm { 
            width: 100%; 
            padding: 18px; 
            background: var(--success); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-confirm:disabled { background: #333; cursor: not-allowed; }

        .item-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="header">
            <div class="logo">Instabasket Admin</div>
            <p style="color: var(--text-s);">Cash Payment Authorization</p>
        </div>

        <div class="bill-summary">
            <div id="billDetails">Loading bill...</div>
            <h2 id="displayTotal" style="margin-top: 10px; color: var(--accent);">₹0.00</h2>
        </div>

        <div class="input-group">
            <label>Enter Mart Password</label>
            <input type="password" id="adminPass" placeholder="••••">
        </div>

        <button class="btn-confirm" id="confirmBtn" onclick="verifyAndPay()">Confirm Cash Payment</button>
        
        <p id="statusMsg" style="margin-top: 15px; font-size: 14px;"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCnzxKihi5R3EBXlQoRABLoH0Z-OGl2R4",
            authDomain: "smartcart-d7f33.firebaseapp.com",
            projectId: "smartcart-d7f33",
            storageBucket: "smartcart-d7f33.firebasestorage.app",
            messagingSenderId: "501090201683",
            appId: "1:501090201683:web:d6baa4f01bd47dc0af16a6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const saleId = params.get('id');
        const martId = params.get('mart');

        async function loadBillForAdmin() {
            if(!saleId || !martId) return;
            const docRef = doc(db, "marts", martId, "sales", saleId);
            const snap = await getDoc(docRef);
            
            if(snap.exists()) {
                const data = snap.data();
                document.getElementById('displayTotal').innerText = `₹${data.total.toFixed(2)}`;
                document.getElementById('billDetails').innerText = `Customer ID: ${saleId}`;
            }
        }

        window.verifyAndPay = async () => {
            const passInput = document.getElementById('adminPass').value;
            const btn = document.getElementById('confirmBtn');
            const msg = document.getElementById('statusMsg');

            if(!passInput) return alert("Please enter password");

            btn.disabled = true;
            btn.innerText = "Verifying...";

            try {
                // 1. Get the Mart's true password from database
                const martRef = doc(db, "marts", martId);
                const martSnap = await getDoc(martRef);

                // Assuming your mart document has a field called 'password'
                if(martSnap.exists() && martSnap.data().password === passInput) {
                    
                    // 2. Update the sale status to "paid"
                    const saleRef = doc(db, "marts", martId, "sales", saleId);
                    await updateDoc(saleRef, { status: "paid" });

                    msg.style.color = "#10b981";
                    msg.innerText = "Payment Successful! Customer redirected.";
                    btn.innerText = "PAID ✅";
                } else {
                    msg.style.color = "#ef4444";
                    msg.innerText = "Incorrect Password!";
                    btn.disabled = false;
                    btn.innerText = "Try Again";
                }
            } catch (e) {
                console.error(e);
                alert("Error processing payment");
                btn.disabled = false;
            }
        };

        loadBillForAdmin();
    </script>
</body>
</html>
