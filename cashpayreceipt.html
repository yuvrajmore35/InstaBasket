<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Payment | Instabasket</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161a;
            --accent: #3b82f6;
            --text-p: #ffffff;
            --text-s: #94a3b8;
            --border: #222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body { 
            background: var(--bg); 
            color: var(--text-p); 
            display: flex; 
            justify-content: center; 
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header { margin-bottom: 25px; }
        .logo { font-size: 28px; font-weight: 800; color: var(--accent); }
        
        .status-badge {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .amount-card {
            background: #000;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }
        .amount-label { font-size: 14px; color: var(--text-s); margin-bottom: 5px; }
        .amount-value { font-size: 36px; font-weight: 800; color: var(--accent); }

        .qr-section {
            background: white;
            padding: 15px;
            border-radius: 15px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .qr-section img { display: block; width: 200px; height: 200px; }

        .instruction { color: var(--text-s); font-size: 14px; line-height: 1.5; padding: 0 10px; }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">Instabasket</div>
            <p style="color: var(--text-s); font-size: 14px;">Cash Payment Mode</p>
        </div>

        <div class="status-badge">Awaiting Confirmation<span class="loading-dots"></span></div>

        <div class="amount-card">
            <p class="amount-label">Amount to Pay</p>
            <div class="amount-value" id="displayTotal">₹0.00</div>
        </div>

        <div class="qr-section" id="qrContainer">
            </div>

        <div class="instruction">
            Please show this QR to the cashier at the counter to verify your items and complete the payment.
        </div>

        <div style="margin-top: 30px; font-size: 12px; color: #444;">
            ID: <span id="displaySaleId">--</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCnzxKihi5R3EBXlQoRABLoH0Z-OGl2R4",
            authDomain: "smartcart-d7f33.firebaseapp.com",
            projectId: "smartcart-d7f33",
            storageBucket: "smartcart-d7f33.firebasestorage.app",
            messagingSenderId: "501090201683",
            appId: "1:501090201683:web:d6baa4f01bd47dc0af16a6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const saleId = params.get('id');
        const martId = params.get('mart');

        async function init() {
            if(!saleId || !martId) return;

            document.getElementById('displaySaleId').innerText = saleId;

            // 1. Fetch the initial amount
            const docRef = doc(db, "marts", martId, "sales", saleId);
            const snap = await getDoc(docRef);
            if(snap.exists()) {
                document.getElementById('displayTotal').innerText = `₹${snap.data().total.toFixed(2)}`;
            }

            // 2. Generate the Admin Link QR
            const adminUrl = `https://smartcart-d7f33.web.app/cashpayfinalreceipt.html?id=${saleId}&mart=${martId}`;
            const qrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(adminUrl)}&size=250&margin=2&ecLevel=H`;
            document.getElementById('qrContainer').innerHTML = `<img src="${qrUrl}" alt="Cashier QR">`;

            // 3. LISTEN for payment confirmation from Admin
            onSnapshot(docRef, (doc) => {
                if (doc.exists() && doc.data().status === "paid") {
                    // Instant redirection once Admin clicks "Confirm"
                    window.location.href = `cashpayfinalreceiptcustomer.html?id=${saleId}&mart=${martId}`;
                }
            });
        }

        init();
    </script>
</body>
</html>
